apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runai-control-plane
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    # The Application owns only the installer objects. The Run:ai release itself
    # is owned by Helm, in the namespace named by release.namespace in the
    # environment values file.
    namespace: runai-installer
  source:
    repoURL: https://github.com/itay-nvn-nv/runai-argocd-helm-job.git
    targetRevision: main
    path: charts/runai-installer
    helm:
      # All environment-specific configuration, including the Run:ai version,
      # lives in this file in git. Upgrading is a one-line commit there; this
      # Application manifest does not need to be touched again.
      #
      # ${ENV_NAME} is substituted at apply time by adapters/apply.sh.
      # Do not kubectl apply this file directly.
      valueFiles:
        - environments/${ENV_NAME}.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
