apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.installer.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runai-installer.labels" . | nindent 4 }}
---
# The Run:ai control-plane chart creates cluster-scoped objects (CRDs,
# ClusterRoles, webhooks, PriorityClasses) and the official docs state the charts
# require Kubernetes administrator permissions. A Job running the documented
# command therefore needs the same rights the admin would have. Scoping this
# down means enumerating every API the chart touches and re-checking it on every
# release, so cluster-admin is the honest option rather than a lax one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "runai-installer.name" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "runai-installer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Values.installer.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
