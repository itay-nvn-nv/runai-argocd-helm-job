# ── Environment-specific values ─────────────────────────────────────────────
# These are the only fields that change between environments. Everything else
# is either chart-level configuration (values.yaml) or generic cluster values.

# Bumped to force the Job to run again without changing the version, to prove a
# re-run adopts the cluster it already registered instead of creating a second.
runCounter: 3

controlPlane:
  # URL of the Run:ai control plane for this environment. The cluster-stage Job
  # authenticates here and fetches the exact helm command to run.
  url: https://itay-26-latest.runailabs-cs.com
  # Secret created out of band in the installer namespace, holding either
  # username + password or clientId + clientSecret. Never in git.
  auth:
    existingSecret: runai-cp-admin

cluster:
  # Wizard question 1.
  name: lab-cluster
  # Wizard question 2: empty means "same URL as the control plane".
  url: ""
  releaseName: runai-cluster
  namespace: runai

chart:
  name: runai-cluster
  # -------------------------------------------------------------------------
  # THE ONLY LINE THAT CHANGES FOR AN UPGRADE.
  # Keep it equal to the control plane version.
  # -------------------------------------------------------------------------
  version: "2.25.32"

# Everything the cluster needs beyond what the control plane generates. The
# control plane already supplies cluster.uid, controlPlane.url,
# controlPlane.clientSecret, cluster.url, the ingress class and the FIPS mode.
clusterValues: |
  {}
