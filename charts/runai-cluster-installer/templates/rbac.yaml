apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.installer.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "runai-cluster-installer.labels" . | nindent 4 }}
---
# The runai-cluster chart installs CRDs, cluster-scoped RBAC, webhooks, a
# scheduler and PriorityClasses, and the docs state the charts require
# Kubernetes administrator permissions. A Job running the documented command
# therefore needs the same rights the admin would have. Scoping this down means
# enumerating every API the chart touches and re-checking it on every release,
# so cluster-admin is the honest option rather than a lax one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "runai-cluster-installer.name" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "runai-cluster-installer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Values.installer.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
